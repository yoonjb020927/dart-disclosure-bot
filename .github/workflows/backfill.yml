name: backfill

# 과거 공시·주가를 받아 저장합니다. 분류는 daily 실행이 대기열로 하루 한도만큼씩 처리합니다.
# OpenDART 일 20,000회 한도 때문에 1년 치는 3개월씩 나눠 실행하세요.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "시작일 YYYYMMDD"
        required: true
      end:
        description: "종료일 YYYYMMDD"
        required: true

permissions:
  contents: write

concurrency:
  group: dartbot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Download filings and prices
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        timeout-minutes: 160
        run: python -m dartbot backfill --start "$START" --end "$END"
      - name: Commit
        if: always()
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: backfill $START-$END"
          git pull --rebase origin main
          git push
