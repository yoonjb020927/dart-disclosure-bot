name: daily

on:
  schedule:
    # 07:00 KST every day (cron is UTC). Missed days are caught up on the next run.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD — 오늘로 간주할 날짜 (비우면 오늘 KST)"
        required: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: dartbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      - name: Collect, classify, backtest, build site
        id: run
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python -m dartbot daily --date "$INPUT_DATE"
          else
            python -m dartbot daily
          fi

      - name: Commit data
        if: steps.run.outputs.status == 'ok'
        env:
          RUN_DATE: ${{ steps.run.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $RUN_DATE"
          # a backfill run may have pushed meanwhile
          git pull --rebase origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.status == 'ok'
        with:
          path: site

      - id: deploy
        if: steps.run.outputs.status == 'ok'
        uses: actions/deploy-pages@v4

      - name: Open an Issue when something breaks
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '## daily 실행 실패\n\n실행 로그: %s\n' "$RUN_URL" > body.md
          gh label create dartbot-failure --color D93F0B --force
          gh issue create --title "⚠️ dartbot 실패 $(date -u +%F)" --body-file body.md --label dartbot-failure
